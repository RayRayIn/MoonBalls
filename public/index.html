
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Лунна гравитация</title>

    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-bottom: 5px;
            font-size: 18px;
        }

        .info {
            margin-bottom: 15px;
            font-size: 14px;
            color: #aaa;
        }

        canvas {
            background: linear-gradient(to bottom, #111, #333);
            border: 4px solid #555;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
    </style>
</head>

<body>

    <h2>Лунна гравитация и физика на топките</h2>

    <div class="info">
        Червена: A/D + W | Синя: Стрелки
    </div>

    <canvas id="gameCanvas" width="600" height="400">
        Your browser does not support Canvas.
    </canvas>

    <div class="info">
        Движете топките с клавиатурата!
    </div>

    <!-- Socket.IO client library -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Our game JavaScript will go here -->
    <script>

                
        // Connect to the Node.js server
        const socket = io();

        console.log("[CLIENT] Connecting to server...");

        // Canvas setup
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const playerRadius = 20;

        let myPlayerId = null;
        let players = {};

        // Keyboard state
        const keys = {
            up: false,
            down: false,
            left: false,
            right: false
        };

        // Connect to server
        socket.on("connect", () => {

            myPlayerId = socket.id;

            console.log("[CLIENT] Connected!");
            console.log("[CLIENT] Session ID:", myPlayerId);

            sendInput();
        });

        // Receive updated positions from server
        socket.on("updatePlayers", (serverPlayers) => {

            console.log("[CLIENT] Received updatePlayers:");
            console.log(serverPlayers);

            players = serverPlayers;

            drawPlayers();
        });

        // Detect keyboard presses
        window.addEventListener("keydown", (event) => {

            let changed = true;

            switch (event.key) {

                case "ArrowUp":
                    keys.up = true;
                    break;

                case "ArrowDown":
                    keys.down = true;
                    break;

                case "ArrowLeft":
                    keys.left = true;
                    break;

                case "ArrowRight":
                    keys.right = true;
                    break;

                default:
                    changed = false;
                    break;
            }

            if (changed) {
                event.preventDefault();
                sendInput();
            }

        });

        // Detect when keys are released
        window.addEventListener("keyup", (event) => {

            let changed = true;

            switch (event.key) {

                case "ArrowUp":
                    keys.up = false;
                    break;

                case "ArrowDown":
                    keys.down = false;
                    break;

                case "ArrowLeft":
                    keys.left = false;
                    break;

                case "ArrowRight":
                    keys.right = false;
                    break;

                default:
                    changed = false;
                    break;
            }

            if (changed) {
                sendInput();
            }

        });

        // Send keyboard input to server
        function sendInput() {

            if (!socket.connected) return;

            const message = {
                sessionId: socket.id,
                pageAddress: window.location.href,

                // Send our current keyboard state
                keys: {
                    up: keys.up,
                    down: keys.down,
                    left: keys.left,
                    right: keys.right
                },

                // Include current displayed coordinates
                x: players[myPlayerId]?.x ?? 150,
                y: players[myPlayerId]?.y ?? 200
            };

            console.log("[CLIENT] Sending playerMove:");
            console.log(message);

            socket.emit("playerMove", message);
        }

        // Draw all players
        function drawPlayers() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (const playerId in players) {

                const player = players[playerId];

                ctx.beginPath();

                ctx.arc(
                    player.x,
                    player.y,
                    playerRadius,
                    0,
                    Math.PI * 2
                );

                // Red for our ball, blue for other players
                ctx.fillStyle =
                    playerId === myPlayerId ? "#ff3333" : "#3388ff";

                ctx.fill();

                ctx.closePath();
            }

        }


    </script>

</body>
</html>
